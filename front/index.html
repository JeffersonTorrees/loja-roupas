<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitrine · Loja de Roupas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <img src="img/logo.svg" alt="Logotipo da Loja de Roupas: uma camiseta verde" width="48" height="48">
    <p>Loja de Roupas</p>
    <nav aria-label="Principal">
      <ul>
        <li><a href="index.html" aria-current="page">Vitrine</a></li>
        <li><a href="cadastro.html">Cadastrar produto</a></li>
      </ul>
    </nav>
    <div class="busca">
      <label for="busca">Buscar produto</label>
      <input id="busca" type="search" placeholder="Ex.: camiseta">
    </div>
  </header>

  <main>
    <h1>Vitrine</h1>
    <p>Promoção da semana: 10% em tudo. Frete grátis a partir de R$ 200.</p>

    <h2 id="titulo-produtos">Produtos</h2>
    <p id="estado" role="status"></p>

    <!-- quem põe os cartões aqui é o app.js -->
    <section id="vitrine" aria-labelledby="titulo-produtos"></section>
  </main>

  <footer>
    <p>Loja de Roupas · Faculdade Senac Pernambuco · 2026</p>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
