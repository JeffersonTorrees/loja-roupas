<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastrar produto · Loja de Roupas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body>
  <header>
    <img src="img/logo.svg" alt="Logotipo da Loja de Roupas: uma camiseta verde" width="48" height="48">
    <p>Loja de Roupas</p>
    <nav aria-label="Principal">
      <ul>
        <li><a href="index.html">Vitrine</a></li>
        <li><a href="cadastro.html" aria-current="page">Cadastrar produto</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h1>Cadastrar produto</h1>

    <form id="form-produto" class="formulario">
      <label for="tipo">Tipo</label>
      <select id="tipo" name="tipo">
        <option value="Produto">Produto</option>
        <option value="Camiseta">Camiseta</option>
        <option value="Calca">Calça</option>
      </select>

      <label for="nome">Nome</label>
      <input id="nome" name="nome" type="text" required>

      <label for="preco">Preço (R$)</label>
      <input id="preco" name="preco" type="number" min="0.01" step="0.01" required>

      <label for="tamanho">Tamanho</label>
      <select id="tamanho" name="tamanho">
        <option value="PP">PP</option>
        <option value="P">P</option>
        <option value="M" selected>M</option>
        <option value="G">G</option>
        <option value="GG">GG</option>
      </select>

      <button type="submit">Cadastrar</button>
    </form>
    <p id="aviso" role="status"></p>
  </main>

  <footer>
    <p>Loja de Roupas · Faculdade Senac Pernambuco · 2026</p>
  </footer>

  <script src="config.js"></script>
  <script src="cadastro.js"></script>
</body>
</html>
