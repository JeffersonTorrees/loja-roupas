# /etc/nginx/conf.d/loja.conf
# Front e API na mesma origem (porta 80): o navegador não precisa de CORS.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    root /opt/loja-roupas/front;
    index index.html;

    # a vitrine: arquivos estáticos (HTML, CSS, JS, imagens)
    location / {
        try_files $uri $uri/ =404;
    }

    # a API: /api/produtos -> http://127.0.0.1:8000/produtos
    # (a barra no fim do proxy_pass tira o prefixo /api)
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
